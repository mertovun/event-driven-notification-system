name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # install-mode: goinstall builds the linter from source using the
          # workflow's Go toolchain (1.26 via setup-go above). Otherwise the
          # action pulls a pre-built binary that may be compiled against an
          # older Go and refuses to load a config targeting Go 1.26:
          #   "the Go language version used to build golangci-lint is lower
          #    than the targeted Go version"
          # We stay on golangci-lint v1.x so the existing .golangci.yml
          # schema keeps working — v2 changed the config format. v8 of the
          # action assumes the v2 module path (...lint/v2/...) and can't
          # install v1.x via goinstall; v6 handles the legacy path correctly.
          install-mode: goinstall
          version: v1.64.8
          args: --timeout=5m

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test -race -count=1 ./...

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run integration tests (testcontainers)
        run: go test -race -count=1 -tags=integration ./...
        env:
          # testcontainers-go reuses the Docker daemon on the runner
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    runs-on: ubuntu-latest
    needs: [lint, fmt, test-unit, vuln]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: notif/notifyd:${{ github.sha }}
          push: false
          load: true
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
