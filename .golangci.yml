run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gocritic
    - gosec
    - bodyclose
    - errorlint
    - noctx
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - prealloc
    - nakedret
    - depguard

linters-settings:
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: github.com/mertovun/event-driven-notification-system
  revive:
    rules:
      - name: var-naming
      - name: exported
      - name: indent-error-flow
      - name: error-return
      - name: error-naming
      - name: receiver-naming
      - name: unused-parameter
  depguard:
    rules:
      domain-stays-clean:
        files:
          - "**/internal/notification/**"
        deny:
          - pkg: "net/http"
            desc: "domain must not depend on transport"
          - pkg: "github.com/go-chi/chi"
            desc: "domain must not depend on HTTP router"
          - pkg: "github.com/jackc/pgx"
            desc: "domain must not depend on the database driver"
          - pkg: "github.com/rabbitmq/amqp091-go"
            desc: "domain must not depend on the message broker"
          - pkg: "github.com/redis/go-redis"
            desc: "domain must not depend on Redis"

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - gosec
        - errcheck
        - unparam
    # G115 (integer overflow on int↔int32 conversions): every site in this
    # codebase converts from one of three safe-by-construction sources —
    # len() over a request body bounded by MaxBodyBytes middleware, an HTTP
    # status code (200-599), or a config int explicitly capped via envconfig.
    # None can exceed int32 in practice. The sqlc-generated *Params types
    # use int32 for Postgres int4 columns, which is why the conversion
    # happens at all. Per-call-site nolint comments would add noise without
    # changing behaviour; if any of these inputs grow unbounded the right
    # answer is an explicit bounds-check at the boundary.
    - linters:
        - gosec
      text: "G115:"
    # gocyclo on branchy handler-shaped functions. Three specific files
    # exempted: pipeline.handle (CAS, SETNX inflight, rate-limit, throttle
    # loop, breaker, attempt-record, retry-tier, success, dead-letter),
    # cmd/notifyd/main.run (composes 10+ subsystems behind
    # --mode=api|worker|all), and the API create/list handlers (decode +
    # idempotency + validation + template-render + persist all in one
    # request scope). The right answer for handle() is the stage-function
    # decomposition documented as future work; the API handlers would
    # benefit from extracting the per-stage validate+record helpers.
    # Both refactors need their own unit-tests-per-stage first.
    - path: internal/worker/pipeline.go
      linters:
        - gocyclo
    - path: cmd/notifyd/main.go
      linters:
        - gocyclo
    - path: internal/api/notifications.go
      linters:
        - gocyclo
    - path: internal/api/notifications_list.go
      linters:
        - gocyclo
  max-same-issues: 0
  max-issues-per-linter: 0
